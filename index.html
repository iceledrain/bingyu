<script>
/* 在线更新：每次改动都把 BYJ_VER 往上加（日期.当天第几次），不然旧的冰雨机发现不了新版本 */
window.BYJ_VER='2026.11.07.25';
/* 启动时如果存着比这个文件更新的版本，就换成新版本运行（同一个页面，数据不动）。地址后面加 #原版 可以跳过 */
(function(){var V=window.BYJ_VER;
  function cmp(a,b){a=String(a||'').split('.');b=String(b||'').split('.');for(var i=0;i<Math.max(a.length,b.length);i++){var x=+a[i]||0,y=+b[i]||0;if(x!==y)return x>y?1:-1}return 0}
  window.byjCmp=cmp;if(window.__byjSwap)return;
  try{var sv=localStorage.getItem('byj_ver'),tries=+localStorage.getItem('byj_try')||0;
    if(!sv||cmp(sv,V)<=0){if(sv)localStorage.removeItem('byj_ver');localStorage.removeItem('byj_try');return}
    if(tries>=1||/原版|%E5%8E%9F%E7%89%88|noupdate/.test(location.hash)){localStorage.removeItem('byj_ver');localStorage.removeItem('byj_try');return}
    localStorage.setItem('byj_try',tries+1);
  }catch(e){return}
  document.write('<plaintext style="display:none">');
  var go=function(){if(window.__byjSwap)return;var q=indexedDB.open('ledphone',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv')};
    var fail=function(){try{localStorage.removeItem('byj_ver')}catch(e){}location.reload()};
    q.onerror=fail;q.onsuccess=function(){try{var r=q.result.transaction('kv').objectStore('kv').get('appHtml');
      r.onsuccess=function(){var h=r.result;if(typeof h!=='string'||h.length<1e5){fail();return}
        window.__byjSwap=1;document.open();document.write(h);document.close()};r.onerror=fail}catch(e){fail()}}};
  addEventListener('DOMContentLoaded',function(){setTimeout(go,0)},{once:true});
})();
</script>

<style>

.foot textarea{flex:1;min-width:0;min-height:0;height:40px;max-height:140px;resize:none;border-radius:20px;padding:8px 14px}

  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + var(--sab)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in h3{margin:0 0 4px;font:400 20px var(--display);text-align:center}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}

.grp .opt{border:0;border-radius:12px;padding:11px 12px;background:none}.grp .opt+.opt{border-top:1px solid var(--line);border-radius:0}
.grp .sec{margin:4px 6px 0}
.opt.red,.tb.red{color:var(--red)}
.sec{font-size:12.5px;color:var(--muted);margin:6px 2px 0;letter-spacing:.04em}
.order{width:220px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:11px 13px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink)}
.order small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.order small svg{width:14px;height:14px}
.order b{font-size:15px;font-weight:600}
.order .os{font-size:12px;color:var(--deep)}
.order.done .os{color:var(--muted)}
.tphoto .tp-in{border:0;width:100%;text-align:left;cursor:pointer}
.tp-f{display:flex;justify-content:space-between;align-items:center}
.tp-f small{font-size:10.5px;color:#a4a4a4}
.tp-f .tb{font-size:12px;padding:2px 4px;color:#747474}
.pcap{font-size:12px;color:var(--muted);max-width:200px}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}

.mi{display:flex;align-items:baseline;gap:10px;font-size:14px}.mi b{font-weight:500;color:var(--deep);min-width:48px;font-variant-numeric:tabular-nums}.mi span{flex:1}.mi small{color:var(--muted);font-size:11px}
.foot.wrap{flex-wrap:wrap}
.blk{width:100%;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);padding:0 2px 4px}
.blk .meter{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:40px}
.blk .meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s}
.blk .btn{padding:6px 14px;font-size:13px}
.coax{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.coax .opt{flex-direction:column;gap:2px;padding:14px 8px}
.coax .opt small{font-size:11.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--deep)}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.letter{align-self:center;max-width:86%;background:var(--accent-soft);border-radius:4px 16px 16px 16px;padding:10px 14px;font:14.5px/1.8 var(--display);white-space:pre-wrap;color:var(--deep)}
.qbar{width:100%;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:0 4px 4px}
.qbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.pmsg img{display:block;max-width:200px;max-height:260px;border-radius:16px}
.tphoto{width:190px;border:0;padding:8px 8px 4px;background:#fff;border-radius:6px;box-shadow:0 4px 14px rgba(65,65,65,.15);display:flex;flex-direction:column;gap:4px;text-align:left;color:#484848}

.voice{display:flex;flex-direction:column;gap:2px;min-width:96px}

.hb{width:216px;border:1px solid var(--line);border-radius:16px;padding:12px 14px 0;background:linear-gradient(135deg,#fff,var(--accent-soft));color:var(--ink);text-align:left;display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.callcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 13px;font-size:14px;max-width:100%;width:fit-content;align-self:flex-start;box-sizing:border-box}

.gcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:170px}

.gvs{display:flex;align-items:center;gap:16px;font-size:34px}

.die{width:44px;height:44px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font:600 22px var(--body);color:var(--deep)}
.gcard.bj{gap:8px}
.bjr{display:flex;align-items:center;gap:8px;width:100%}
.bjr b{font:400 12px var(--body);color:var(--muted);width:20px}
.bjr i{margin-left:auto;font-style:normal;font:600 15px var(--body);color:var(--deep)}
.bjh{display:flex;gap:4px}
.card{min-width:26px;height:36px;padding:0 4px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font:600 14px var(--body);color:var(--deep)}
.scard{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;width:100%;background:var(--bub);border:1px solid rgba(255,255,255,.6);box-shadow:var(--lift);border-radius:16px;padding:10px 13px;color:inherit;font:inherit}
.scard small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}

.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.ttt{display:grid;grid-template-columns:repeat(3,48px);gap:5px}

.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px;padding:4px 0 8px}

.money-big{text-align:center;font:600 40px var(--body);color:var(--deep);font-variant-numeric:tabular-nums}
.content>*{flex-shrink:0}
.call{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;color:#fff;background:#252525;overflow:hidden;
  padding:calc(var(--sat) + 36px) max(18px,env(safe-area-inset-right,0px)) calc(var(--sab) + 22px) max(18px,env(safe-area-inset-left,0px))}

.chead{display:flex;flex-direction:column;align-items:center;gap:6px}
.chead .av{box-shadow:0 0 0 6px rgba(255,255,255,.12)}

.cbtns{display:flex;gap:52px;justify-content:center;margin-top:16px}

.cb svg{width:28px;height:28px}
.cb.sm{width:44px;height:44px;flex:none}.cb.sm svg{width:20px;height:20px}
.cb.end{background:var(--deep)}.cb.ok{background:var(--accent)}

.call.mini{top:calc(var(--sat) + 64px);right:10px;bottom:auto;left:auto;width:132px;height:176px;padding:0;gap:0;flex-direction:column;align-items:stretch;border-radius:16px;border:1px solid rgba(255,255,255,.4);background:#252525;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

.call.mini .cb.end{position:absolute!important;right:8px;bottom:8px;width:30px;height:30px}.call.mini .cb.end svg{width:16px;height:16px}

<script>
const $=s=>document.querySelector(s);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* a sticker name copied out of Word drags the link's field code along (「名字 HYPERLINK  normalLink」): keep only the name */

function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';if(s<86400)return Math.floor(s/3600)+'小时前';const d=new Date(t);return(d.getMonth()+1)+'/'+d.getDate()}
function hm(t){const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
/* 在线更新：从 GitHub（连不上就走 jsDelivr 镜像）拉最新的 index.html，比 BYJ_VER 新就存进 IndexedDB，下次启动由开头那段脚本换上 */
const UPD_SRC=['https://raw.githubusercontent.com/iceledrain/bingyu/main/index.html','https://cdn.jsdelivr.net/gh/iceledrain/bingyu@main/index.html','https://fastly.jsdelivr.net/gh/iceledrain/bingyu@main/index.html'];
let updNew=null;
async function updFetch(){const one=async url=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);
    try{const r=await fetch(url+'?t='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw 0;const h=await r.text(),v=h.match(/window\.BYJ_VER='([\d.]+)'/);
      if(!v||h.length<1e5||!/<\/html>\s*$/.test(h))throw 0;return{ver:v[1],html:h}}finally{clearTimeout(t)}};
  const got=(await Promise.allSettled(UPD_SRC.map(one))).filter(x=>x.status==='fulfilled').map(x=>x.value);
  if(!got.length)throw new Error('连不上 GitHub，检查网络再试');
  const best=got.sort((a,b)=>byjCmp(b.ver,a.ver))[0];return byjCmp(best.ver,window.BYJ_VER)>0?(updNew=best):null}

  updFetch().then(u=>{if(u&&u.ver!==S.updSkip&&$('#sheet').hidden)updAsk(u)}).catch(()=>{})}

  if(file.type==='image/gif'&&file.size<900000){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);return}

async function unzip(buf){const d=new DataView(buf),u=new Uint8Array(buf),out={};let e=buf.byteLength-22;while(e>=0&&d.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('压缩包打不开');

const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('ledphone',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},

   A phone-sized web page that acts out a moment of TA's life. It is written from a designer's prompt with TA's material
   handed over, not from TA's chat prompt (that made models answer like a chat message, with no page at all). The page is
   pulled out of the reply however it comes back, asked for once more if there is none, and shown sandboxed in an

const thFmt=id=>S.thFmts.find(f=>f.id===id)||S.thFmts[0];

function thText(html,n){return String(html||'').replace(/<(style|script)[\s\S]*?<\/\1>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim().slice(0,n)}

/* the page out of a reply: a fenced block, a bare fragment or a whole document; nothing that reaches outside or pins to the screen */
function thExtract(out){const s=String(out||'').replace(/<think(?:ing)?>[\s\S]*?<\/think(?:ing)?>/gi,'');
  const f=s.match(/```[a-zA-Z]*\s*\n?([\s\S]*?)(?:```|$)/);let code=f&&/<[a-z!]/i.test(f[1])?f[1]:null;
  if(!code){const i=s.search(/<(?:!doctype|html|head|title|style|div|section|main|article|body|header|svg|ul|ol|table|p|h[1-6])\b/i);if(i<0)return null;code=s.slice(i)}
  let title=((code.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||s.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'').trim();
  if(/<body[\s>]/i.test(code))code=(code.match(/<style[\s\S]*?<\/style>/gi)||[]).join('')+((code.match(/<body[^>]*>([\s\S]*?)(?:<\/body>|$)/i)||[])[1]||'');

const TH_SYS=`你是「小剧场」的编剧兼网页设计师。小剧场是一张手机屏幕大小的小网页，演出角色生活里的一个片段，让人一眼看出角色的性格和TA与对方的关系。
输出规则，一定遵守：
1. 只输出一个 \`\`\`html 代码块，代码块外不写任何字。
2. 代码块第一行写 <title>标题</title>，12 个字以内。

  try{const ctx=buildCtx(t,{mode:'call',kind:call.kind});const msgs=[...ctx.msgs,...call.lines.map(l=>({role:l.me?'user':'assistant',content:l.text}))];
    if(call.status==='out')msgs.push({role:'user',content:`（${mask().name}给你打来${k}通话。愿意接就直接说你接起来的第一句话；如果真的不方便或者不想接，只写 [拒接]，下一行写一句原因，会作为消息发给${mask().name}。）`});
    else if(!call.lines.length)msgs.push({role:'user',content:`（你给${mask().name}打的${k}通话，TA接起来了。说第一句话。）`});
    const out=await callAI(ctx.system,msgs,{max:1024});if(!call||call.tid!==t.id)return;
    const ex=extractExtras(out);applyTide(ctx,ex);
    if(ex.acts.includes('拒接')){call.wait=false;endCall('refused',ex.text);return}
    if(call.status==='out')callOn();
    if(ex.inner.length)call.inner=(call.inner?call.inner+'\n':'')+ex.inner.join('\n');
    const lines=ex.text.split('\n').map(s=>s.trim()).filter(Boolean);call.wait=false;
    for(const l of lines){if(!call)return;call.lines.push({text:l});updCall();if(call.tts)await speak(l,c)}
    if(ex.acts.includes('挂断')&&call){await sleep(800);endCall('done')}
  }catch(e){toast(e.message,5000);if(call&&call.status==='out')endCall('fail')}
  finally{if(call){call.wait=false;updCall()}}}
async function callSay(txt){if(!call||call.status!=='on')return;txt=String(txt||'').trim();
  if(txt){call.lines.push({me:true,text:txt});updCall();return}if(!call.wait)await callTurn()}
function endCall(how,why){const c0=call;if(!c0)return;call=null;clearInterval(callTimer);clearTimeout(c0.ring);try{vAudio&&vAudio.pause()}catch(e){}renderCall();
  const t=thread(c0.tid),c=charById(t.chars[0]),k=c0.kind==='video'?'视频':'语音';
  if(how==='missed')sysMsg(t,`${dn(c)} 给你打了${k}通话 · 未接`);
  else if(how==='declined')sysMsg(t,`你拒接了 ${dn(c)} 的${k}通话`);
  else if(how==='refused'){sysMsg(t,`${dn(c)} 拒接了你的${k}通话`);for(const l of String(why||'').split('\n').map(s=>s.trim()).filter(Boolean))t.msgs.push({id:uid(),from:c.id,type:'text',content:l,t:Date.now()})}
  else if(c0.start){const dur=Math.round((Date.now()-c0.start)/1000);t.msgs.push({id:uid(),from:c0.dir==='in'?c.id:'me',type:'call',kind:c0.kind,dur,content:c0.lines.map(l=>(l.me?mask().name:c.name)+'：'+l.text).join('\n'),...(c0.inner?{inner:c0.inner}:{}),t:Date.now()})}
  else if(how!=='fail')sysMsg(t,`你取消了${k}通话`);
  t.t=Date.now();save();onThreadUpdate(t);if(cur()?.v==='chat'&&cur().id===t.id)render(true);if(!isOpen())renderHome()}

function tttWin(b){for(const [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'draw':''}

  let m=tw('O');if(m===undefined&&Math.random()<.85)m=tw('X');if(m===undefined&&!b[4]&&Math.random()<.7)m=4;if(m===undefined)m=free[Math.floor(Math.random()*free.length)];return m}

chat(v){
  const t=thread(v.id);if(!t)return{title:'不见了',body:''};if(t.unread){t.unread=0;save()}

    foot:`<textarea id="msgIn" rows="1" placeholder="你的动作和话" aria-label="你的动作和话"></textarea><button class="sq go" data-a="send" aria-label="发送">${ICONS.send}</button>`,
    after(){const c=$('#content');c.scrollTop=c.scrollHeight;const ta=$('#msgIn');if(ta)ta.addEventListener('input',()=>{ta.style.height='40px';ta.style.height=Math.min(140,ta.scrollHeight)+'px'})}};

  let footCls='';

  if(r.youBlocked)foot=`<div class="notice">你已拉黑${esc(dn(c0))}<button class="btn o" data-a="unblock">解除拉黑</button></div>`;

  if(t.game&&!r.youBlocked&&!r.theyDeleted){footCls='wrap';foot=`<div class="blk"><span>正在${t.game==='study'?'学':'玩'}「${esc(gameName(t))}」</span><span style="flex:1"></span>${t.game==='truth'?'<button class="btn" data-a="todRoll">掷骰子</button>':''}<button class="btn o" data-a="gEnd">${t.game==='study'?'下课':'结束游戏'}</button></div>`+foot}
  return{title:threadTitle(t),sub:t.type==='group'?(t.chars.length+1)+' 人':(c0?.mood||'在线'),cls:'chat',footCls,
    right:`<button class="tb" data-a="chatMenu" aria-label="聊天设置">···</button>`,
    body:msgsHTML(t),foot,
    after(){const c=$('#content');c.scrollTop=c.scrollHeight;const ta=$('#msgIn');if(ta)ta.addEventListener('input',()=>{ta.style.height='40px';ta.style.height=Math.min(140,ta.scrollHeight)+'px'})}};
},

plan(v){const P=S.plan,d=planDay(),L=d.items,n=L.filter(x=>x.done).length,sup=charById(P.sup),cs=S.chars.filter(visible),now=new Date();

    case'preset':return presetById(v.id);case'item':return presetById(v.id)?.items.find(x=>x.id===v.iid);

  g.translate(90,90);g.strokeStyle=ink;g.lineWidth=7.5;g.lineCap='round';
  for(let i=0;i<6;i++){g.rotate(Math.PI/3);g.beginPath();g.moveTo(0,0);g.lineTo(0,-60);
    for(const [at,dx,dy] of [[35,14.7,49.7],[52,15.6,67.6]]){g.moveTo(0,-at);g.lineTo(-dx,-dy);g.moveTo(0,-at);g.lineTo(dx,-dy)}g.stroke()}
  g.fillStyle=ink;g.beginPath();g.arc(0,0,7.5,0,7);g.fill();return snowIcon=c.toDataURL('image/png')}
function setTouchIcon(){try{let l=document.getElementById('touchIcon');if(!l){l=document.createElement('link');l.id='touchIcon';l.rel='apple-touch-icon';document.head.appendChild(l)}l.href=touchIconUrl()}catch(e){}}

(async()=>{
  await DB.open();
  let raw=await DB.get('state');
  if(!raw){try{const old=JSON.parse(localStorage.getItem('xphone_v1')||'null');if(old&&old.chars){const s=def();s.chars=old.chars.map(c=>({id:c.id,name:c.name,remark:'',handle:(c.name||'').toLowerCase(),avatar:c.avatar||'',innerStyle:'',persona:c.persona||'',books:[]}));
    s.threads=Object.entries(old.chats||{}).filter(([id])=>s.chars.some(c=>c.id===id)).map(([id,ms])=>({id:uid(),type:'dm',chars:[id],title:'',mode:'online',unread:0,t:Date.now(),msgs:ms.map(m=>({id:uid(),from:m.role==='user'?'me':id,type:'text',content:m.content,t:m.t||Date.now()}))}));
    raw=JSON.stringify(s)}}catch(e){}}
  try{S=mergeState(raw?JSON.parse(raw):null)}catch(e){S=def()}
  applyLook();renderHome();loadFont();ensureHolidays();
  setTouchIcon();
  try{localStorage.removeItem('byj_try');if(!localStorage.getItem('byj_ver'))DB.get('appHtml').then(h=>{if(h)DB.del('appHtml')})}catch(e){}
  setTimeout(updAuto,4000);
  let tickSaved=0;const idle=f=>window.requestIdleCallback?requestIdleCallback(f,{timeout:3000}):setTimeout(f,200);
  const tick=()=>{const now=Date.now(),m=S.lastTick?Math.min(180,(now-S.lastTick)/60e3):0;S.lastTick=now;if(m>0){softTick(m);lifeTick(m)}if(now-tickSaved>60e3){tickSaved=now;idle(save)}};
  tick();setInterval(tick,20e3);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);DB.set('state',JSON.stringify(S))}else{setAppH();tick()}});
})();
</script>
