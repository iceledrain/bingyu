  if(!bad.length)return;S.chars=S.chars.filter(c=>!bad.includes(c.id));S.threads=S.threads.filter(t=>!(t.type==='dm'&&bad.includes(t.chars[0])));save()}
function purgeChar(id){S.chars=S.chars.filter(c=>c.id!==id);S.threads.forEach(t=>t.chars=t.chars.filter(x=>x!==id));S.threads=S.threads.filter(t=>t.chars.length&&!(t.type==='group'&&t.chars.length<2&&!t.msgs.length));

  if(el.dataset.a2==='itemOn'){presetById(cur().id).items.find(x=>x.id===el.dataset.id).on=el.checked;save()}

    fs.forEach(f=>readImg(f,960,url=>{if(postDraft.pics.length<9)postDraft.pics.push(url);done()},'image/jpeg',done));return}
  if(el.dataset.img){const f=el.files?.[0];if(!f)return;const k=el.dataset.img;
    const max={gav:320,wall:1600,photo:600,char:320,mask:320,mocover:1400,chatimg:960}[k]||400;
    readImg(f,max,url=>{if(k==='chatimg'){closeSheet();pushMine(thread(cur().id),{type:'img',img:url,content:''});return}
      if(k==='gav')thread(cur().id).avatar=url;else if(k==='mocover')(cur()?.v==='maskEdit'&&maskById(cur().id)||mask()).mocover=url;else if(k==='char'){const c=charById(cur().id);c.avatar=url;delete c.avatarOld}else if(k==='mask')maskById(cur().id).avatar=url;else if(k==='wall')S.look.wallpaper=url;else if(k==='photo')S.look.photo=url;
      save();applyLook();if(appEl.classList.contains('open'))render(true);else renderHome()})}
  if(el.dataset.stk){const g=S.stickers.groups.find(x=>x.id===cur().gid);let n=0;
    const img=f=>new Promise(ok=>readImg(f,240,url=>{g.items.push({id:uid(),name:base_(f.name).slice(0,24)||'表情',src:url});n++;ok()},'image/png',ok)),isImg=/\.(png|jpe?g|gif|webp|bmp|avif|heic)$/i;
    for(const f of [...el.files]){try{if(/^image\//.test(f.type)||isImg.test(f.name))await img(f);
      else if(/\.zip$/i.test(f.name)){for(const [nm,u] of Object.entries(await unzip(await f.arrayBuffer())))if(isImg.test(nm)&&!/__MACOSX/.test(nm))await img(new File([u],nm.split('/').pop(),{type:'image/'+nm.split('.').pop().toLowerCase().replace('jpg','jpeg')}))}
      else{const t=await readDoc(f);let d=null;try{d=JSON.parse(t)}catch(e){}for(const x of d?stkJson(d):stkLines(t)){g.items.push({id:uid(),name:stkName(x.name)||'表情'+(allStickers().length+1),src:x.src});n++}}}catch(e){toast(e.message||'读不出来')}}
    if(!n){toast('这个文件里没找到表情');return}
    save();render(true);toast('加了 '+n+' 个')}
  if(['impFile','impBook','impPreset','impRx'].includes(el.id)){const f=el.files?.[0];if(!f)return;const txt=await(el.id==='impBook'?readDoc(f):readText(f));if(el.id==='impFile'){el.value='';A.imp(null,txt);return}const ta=$('#'+(el.id==='impFile'?'impTa':el.id+'Ta'));ta.value=txt;ta.dataset.name=base_(f.name);if(el.id==='impFile'){el.value='';A.imp();return}toast('读好了，点「导入」')}
});

let snowIcon='';
function touchIconUrl(){if(snowIcon)return snowIcon;
  const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,180,180);bg.addColorStop(0,'#ffffff');bg.addColorStop(.5,'#f2f2f2');bg.addColorStop(1,'#d6d6d6');g.fillStyle=bg;g.fillRect(0,0,180,180);
  const ink=g.createLinearGradient(0,22,0,158);ink.addColorStop(0,'#a8a8a8');ink.addColorStop(1,'#5c5c5c');
  g.translate(90,90);g.strokeStyle=ink;g.lineWidth=7.5;g.lineCap='round';
  for(let i=0;i<6;i++){g.rotate(Math.PI/3);g.beginPath();g.moveTo(0,0);g.lineTo(0,-60);
    for(const [at,dx,dy] of [[35,14.7,49.7],[52,15.6,67.6]]){g.moveTo(0,-at);g.lineTo(-dx,-dy);g.moveTo(0,-at);g.lineTo(dx,-dy)}g.stroke()}
  g.fillStyle=ink;g.beginPath();g.arc(0,0,7.5,0,7);g.fill();return snowIcon=c.toDataURL('image/png')}
function setTouchIcon(){try{let l=document.getElementById('touchIcon');if(!l){l=document.createElement('link');l.id='touchIcon';l.rel='apple-touch-icon';document.head.appendChild(l)}l.href=touchIconUrl()}catch(e){}}

    s.threads=Object.entries(old.chats||{}).filter(([id])=>s.chars.some(c=>c.id===id)).map(([id,ms])=>({id:uid(),type:'dm',chars:[id],title:'',mode:'online',unread:0,t:Date.now(),msgs:ms.map(m=>({id:uid(),from:m.role==='user'?'me':id,type:'text',content:m.content,t:m.t||Date.now()}))}));
    raw=JSON.stringify(s)}}catch(e){}}
  let loaded=false,bad=DB.bad||lost;try{const d=raw?JSON.parse(raw):null;S=mergeState(d);if(raw&&![2,3,4].includes(d?.v))bad=1;loaded=!!raw&&!bad}catch(e){S=def();if(raw)bad=1}
  ready=!bad;lostDb=lost;seen=seen||!document.hidden;if(bad)toast('读档没成功，原来的存档没动。先别清数据，刷新再试',6e5);DB.leg=leg&&loaded;if(loaded){snap(raw);if(DB.db&&!leg)['state','sv:old','sv:upd'].forEach(x=>DB.del(x))}flush();
  applyLook();renderHome();ensureHolidays();if(loaded)setTimeout(picGC,4000);
  setTouchIcon();
  try{localStorage.removeItem('byj_try');localStorage.removeItem('byj_ver');DB.del('appHtml')}catch(e){}
  let tickSaved=0;const idle=f=>window.requestIdleCallback?requestIdleCallback(f,{timeout:3000}):setTimeout(f,200);
  const tick=()=>{const now=Date.now(),seen=S.seenAt||S.lastTick,m=S.lastTick?Math.min(180,(now-S.lastTick)/60e3):0;S.lastTick=now;
    if(!document.hidden){const gone=seen?now-seen:0;S.seenAt=now;if(gone>=90*60e3)awayCatch(now-gone,now)}
    if(m>0)lifeTick(m);keepWarm();if(now-tickSaved>60e3){tickSaved=now;idle(save)}};
  tick();setInterval(tick,20e3);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();DB.sure=0}else{seen=1;setAppH();fresh().then(ok=>{if(ok){flush();tick()}})}});
})();
