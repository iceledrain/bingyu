    const max={pphoto:700,appwall:1400,wall:1600,photo:600,icon:200,char:320,mask:320,cwall:1400,cvbg:1200,twall:1400,banner:1200,mocover:1400,chatimg:960}[k]||400;
    readImg(f,max,url=>{if(k==='chatimg'){closeSheet();pushMine(thread(cur().id),{type:'img',img:url,content:''});return}
      if(k==='pphoto')charById(cur().id).pphoto=url;else if(k==='appwall')S.look.appWalls[el.dataset.id]=url;else if(k==='cwall')charById(cur().id).wall=url;else if(k==='cvbg')charById(cur().id).vbg=url;else if(k==='twall')thread(cur().id).wall=url;else if(k==='banner')mask().banner=url;else if(k==='mocover')(cur()?.v==='maskEdit'&&maskById(cur().id)||mask()).mocover=url;else if(k==='char'){const c=charById(cur().id);c.avatar=url;delete c.avatarOld}else if(k==='mask')maskById(cur().id).avatar=url;else if(k==='icon')S.look.icons[el.dataset.id]=url;else if(k==='wall')S.look.wallpaper=url;else if(k==='photo')S.look.photo=url;
      save();applyLook();if(appEl.classList.contains('open'))render(true);else renderHome()})}
  if(el.dataset.stk){const g=S.stickers.groups.find(x=>x.id===cur().gid);let n=0;
    const img=f=>new Promise(ok=>readImg(f,240,url=>{g.items.push({id:uid(),name:base_(f.name).slice(0,24)||'表情',src:url});n++;ok()},'image/png',ok)),isImg=/\.(png|jpe?g|gif|webp|bmp|avif|heic)$/i;
    for(const f of [...el.files]){try{if(/^image\//.test(f.type)||isImg.test(f.name))await img(f);
      else if(/\.zip$/i.test(f.name)){for(const [nm,u] of Object.entries(await unzip(await f.arrayBuffer())))if(isImg.test(nm)&&!/__MACOSX/.test(nm))await img(new File([u],nm.split('/').pop(),{type:'image/'+nm.split('.').pop().toLowerCase().replace('jpg','jpeg')}))}
      else{const t=await readDoc(f);let d=null;try{d=JSON.parse(t)}catch(e){}for(const x of d?stkJson(d):stkLines(t)){g.items.push({id:uid(),name:stkName(x.name)||'表情'+(allStickers().length+1),src:x.src});n++}}}catch(e){toast(e.message||'读不出来')}}
    if(!n){toast('这个文件里没找到表情');return}
    save();render(true);toast('加了 '+n+' 个')}
  if(el.dataset.font){const f=el.files?.[0];if(!f)return;if(!DB.db){toast('这个浏览器存不了字体文件，用链接吧');return}await DB.set('font:custom',f);
    S.look.customFont={local:true,name:base_(f.name),t:Date.now()};S.look.font='custom';fontLoaded='';save();await loadFont();render(true);return}
  if(['impFile','impChar','impBook','impPreset'].includes(el.id)){const f=el.files?.[0];if(!f)return;const txt=await(el.id==='impBook'?readDoc(f):readText(f));if(el.id==='impFile'){el.value='';A.imp(null,txt);return}const ta=$('#'+(el.id==='impFile'?'impTa':el.id+'Ta'));ta.value=txt;ta.dataset.name=base_(f.name);if(el.id==='impFile'){el.value='';A.imp();return}toast('读好了，点「导入」')}
});

let snowIcon='';
function touchIconUrl(){if(S.look.homeIcon)return S.look.homeIcon;if(snowIcon)return snowIcon;
  const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,180,180);bg.addColorStop(0,'#ffffff');bg.addColorStop(.5,'#f2f2f2');bg.addColorStop(1,'#d6d6d6');g.fillStyle=bg;g.fillRect(0,0,180,180);
  const ink=g.createLinearGradient(0,22,0,158);ink.addColorStop(0,'#a8a8a8');ink.addColorStop(1,'#5c5c5c');
  g.translate(90,90);g.strokeStyle=ink;g.lineWidth=7.5;g.lineCap='round';
  for(let i=0;i<6;i++){g.rotate(Math.PI/3);g.beginPath();g.moveTo(0,0);g.lineTo(0,-60);
    for(const [at,dx,dy] of [[35,14.7,49.7],[52,15.6,67.6]]){g.moveTo(0,-at);g.lineTo(-dx,-dy);g.moveTo(0,-at);g.lineTo(dx,-dy)}g.stroke()}
  g.fillStyle=ink;g.beginPath();g.arc(0,0,7.5,0,7);g.fill();return snowIcon=c.toDataURL('image/png')}
function setTouchIcon(){try{let l=document.getElementById('touchIcon');if(!l){l=document.createElement('link');l.id='touchIcon';l.rel='apple-touch-icon';document.head.appendChild(l)}l.href=touchIconUrl()}catch(e){}}

(async()=>{
  await DB.open();
  let raw=await DB.get('state');
  if(!raw){try{const old=JSON.parse(localStorage.getItem('xphone_v1')||'null');if(old&&old.chars){const s=def();s.chars=old.chars.map(c=>({id:c.id,name:c.name,remark:'',handle:(c.name||'').toLowerCase(),avatar:c.avatar||'',innerStyle:'',persona:c.persona||'',books:[]}));
    s.threads=Object.entries(old.chats||{}).filter(([id])=>s.chars.some(c=>c.id===id)).map(([id,ms])=>({id:uid(),type:'dm',chars:[id],title:'',mode:'online',unread:0,t:Date.now(),msgs:ms.map(m=>({id:uid(),from:m.role==='user'?'me':id,type:'text',content:m.content,t:m.t||Date.now()}))}));
    raw=JSON.stringify(s)}}catch(e){}}
  try{S=mergeState(raw?JSON.parse(raw):null)}catch(e){S=def()}
  applyLook();renderHome();loadFont();ensureHolidays();
  setTouchIcon();
  try{localStorage.removeItem('byj_try');if(!localStorage.getItem('byj_ver'))DB.get('appHtml').then(h=>{if(h)DB.del('appHtml')})}catch(e){}
  setTimeout(updAuto,4000);
  let tickSaved=0;const idle=f=>window.requestIdleCallback?requestIdleCallback(f,{timeout:3000}):setTimeout(f,200);
  const tick=()=>{const now=Date.now(),m=S.lastTick?Math.min(180,(now-S.lastTick)/60e3):0;S.lastTick=now;if(m>0){softTick(m);lifeTick(m)}if(now-tickSaved>60e3){tickSaved=now;idle(save)}};
  tick();setInterval(tick,20e3);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);DB.set('state',JSON.stringify(S))}else{setAppH();tick()}});
})();
